{% extends "base.html" %}

{% block title %}Update Todo{% endblock %}

{% block content %}
<style>
    .checkbox-wrapper {
        display: flex;
        flex-direction: row !important;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem;
        background: #f9fafb;
        border-radius: 8px;
    }

    .checkbox-wrapper label {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        cursor: pointer;
        margin: 0;
    }
</style>

<div class="container">
    <h1>Update Todo</h1>

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{ todo.title }}" required>
        </div>

        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description">{{ todo.description }}</textarea>
        </div>

        <div>
            <label for="priority">Priority:</label>
            <select id="priority" name="priority">
                <option value="1" {% if todo.priority == 1 %}selected{% endif %}>Low</option>
                <option value="2" {% if todo.priority == 2 %}selected{% endif %}>Medium</option>
                <option value="3" {% if todo.priority == 3 %}selected{% endif %}>High</option>
            </select>
        </div>

        <div class="checkbox-wrapper">
            <label for="completed">
                <input type="checkbox" id="completed" name="completed" {% if todo.completed %}checked{% endif %}>
                <span>Mark as completed</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Update Todo</button>
            <a href="{% url 'todo-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
